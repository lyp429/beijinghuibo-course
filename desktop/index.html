<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北京汇博智能实训基地</title>
<meta name="description" content="北京汇博智能实训基地，聚焦人工智能、具身智能、机器人、工业视觉与智能制造人才培养。">

<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/hero.css">
<link rel="stylesheet" href="./css/industry.css">
<link rel="stylesheet" href="./css/courses.css">
<link rel="stylesheet" href="./css/about.css">
<link rel="stylesheet" href="./css/embodied.css">

<script defer src="./js/header.js"></script>
<script defer src="./js/hero.js"></script>
<script defer src="./js/main.js"></script>
</head>

<body>

<header class="header" id="siteHeader">
    <div class="header-inner">

        <a class="brand brand-only" href="#home" aria-label="汇博机器人首页">
            <img
                class="brand-logo brand-logo-light"
                src="../images/logo-color-transparent.png"
                alt="汇博机器人">

            <img
                class="brand-logo brand-logo-dark"
                src="../images/logo.png"
                alt=""
                aria-hidden="true">
        </a>

        <div class="header-right">

            <nav class="header-nav" aria-label="主导航">
                <a href="#home">首页</a>
                <a href="#industry">产教融合</a>
                <a href="#courses">培训课程</a>
                <a href="#about">基地概况</a>
                <a href="#embodied">具身智能</a>
            </nav>

            <div class="header-tools">

                <button
                    class="header-search-btn"
                    id="headerSearchBtn"
                    type="button"
                    aria-label="搜索"
                    aria-expanded="false">

                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="10.8" cy="10.8" r="6.4"></circle>
                        <path d="M15.7 15.7L21 21"></path>
                    </svg>
                </button>

                <button
                    class="header-contact-btn"
                    id="headerContactBtn"
                    type="button">
                    合作 / 联系
                </button>

            </div>

        </div>

        <!-- 搜索外观面板：目前只做 UI，真正站内搜索后续再接 -->
        <div class="header-search-panel" id="headerSearchPanel" aria-hidden="true">
            <div class="header-search-box">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="10.8" cy="10.8" r="6.4"></circle>
                    <path d="M15.7 15.7L21 21"></path>
                </svg>

                <input
                    type="search"
                    id="headerSearchInput"
                    placeholder="搜索课程、产教融合、基地内容…"
                    autocomplete="off">

                <button
                    class="header-search-close"
                    id="headerSearchClose"
                    type="button"
                    aria-label="关闭搜索">
                    ×
                </button>
            </div>
        </div>

    </div>
</header>

<main id="site-content">
    <div class="site-loading" id="siteLoading">
        正在加载北京汇博智能实训基地…
    </div>
</main>

<footer class="footer">
    <div class="footer-inner">
        <span>北京汇博智能实训基地</span>
        <span>ARTIFICIAL INTELLIGENCE · ROBOTICS · INTELLIGENT MANUFACTURING</span>
    </div>
</footer>

</body>
</html>
