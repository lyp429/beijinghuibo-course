<script>



/* ==========================
滚动显示动画
========================== */


const screens =

document.querySelectorAll(
".screen"
);



const observer =

new IntersectionObserver(

(entries)=>{


entries.forEach(

entry=>{


if(entry.isIntersecting){


entry.target.classList.add(
"active"
);



}


}



)

},


{

threshold:.25

}



);



screens.forEach(

screen=>{


observer.observe(screen);


}

);








/* ==========================
粒子背景
========================== */


const canvas =

document.createElement(
"canvas"
);



canvas.id="particles";



document.body.appendChild(
canvas
);



const ctx =

canvas.getContext(
"2d"
);



let particles=[];


let w,h;





function resize(){


w=

canvas.width=

window.innerWidth;



h=

canvas.height=

window.innerHeight;



}



resize();


window.addEventListener(
"resize",
resize
);







class Particle{


constructor(){


this.x=Math.random()*w;


this.y=Math.random()*h;


this.size=Math.random()*2;


this.speedX=(Math.random()-.5)*.3;


this.speedY=(Math.random()-.5)*.3;


}




update(){


this.x+=this.speedX;


this.y+=this.speedY;



if(
this.x<0||
this.x>w
)
this.x=Math.random()*w;



if(
this.y<0||
this.y>h
)
this.y=Math.random()*h;


}




draw(){


ctx.beginPath();


ctx.arc(

this.x,

this.y,

this.size,

0,

Math.PI*2

);



ctx.fillStyle=

"rgba(70,220,255,.55)";



ctx.fill();



}


}





function createParticles(){


particles=[];



for(
let i=0;
i<100;
i++
){


particles.push(
new Particle()
);


}



}



createParticles();






function animate(){


ctx.clearRect(
0,
0,
w,
h
);




particles.forEach(

p=>{


p.update();


p.draw();


}




);




requestAnimationFrame(
animate
);



}



animate();










/* ==========================
PC滚轮一屏一停
========================== */


if(
window.innerWidth>900
){



let scrolling=false;



window.addEventListener(

"wheel",

(e)=>{



if(scrolling)

return;



let current=

Math.round(
window.scrollY/window.innerHeight
);




let next=current;



if(e.deltaY>0)

next++;


else

next--;





next=Math.max(

0,

Math.min(

document.querySelectorAll(".screen").length-1,

next

)

);




if(next!==current){



e.preventDefault();



scrolling=true;



window.scrollTo({

top:

next*

window.innerHeight,

behavior:"smooth"


});




setTimeout(()=>{


scrolling=false;


},900);



}



},

{

passive:false

}


);



}




</script>
