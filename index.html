<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>北京汇博智能培训课程中心 | 人工智能·机器人·智能制造</title>

    <meta name="description"
          content="北京汇博智能科技有限公司，面向高校、企业及技能人才开展人工智能、机器人、智能制造、工业视觉、数字孪生等职业技能培训及产教融合服务。">

    <style>
        :root{
            --bg:#020817;
            --bg2:#061126;
            --card:#07152c;
            --blue:#2e8cff;
            --cyan:#00d7ff;
            --text:#ffffff;
            --muted:#9baac0;
            --line:rgba(68,151,255,.20);
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html{
            scroll-behavior:smooth;
        }

        body{
            font-family:
            "Microsoft YaHei",
            "PingFang SC",
            "Helvetica Neue",
            Arial,
            sans-serif;

            background:
                radial-gradient(circle at 75% 10%, rgba(22,91,210,.18), transparent 35%),
                #020817;

            color:white;
            overflow-x:hidden;
        }

        a{
            color:inherit;
            text-decoration:none;
        }

        img{
            max-width:100%;
            display:block;
        }

        /* ==========================
           顶部导航
        ========================== */

        .header{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            z-index:1000;

            background:rgba(1,7,18,.72);
            backdrop-filter:blur(18px);
            border-bottom:1px solid rgba(255,255,255,.05);
        }

        .nav{
            max-width:1400px;
            height:76px;
            margin:auto;
            padding:0 30px;

            display:flex;
            align-items:center;
            justify-content:space-between;
        }

        .brand{
            display:flex;
            align-items:center;
            gap:13px;
        }

        .logo-symbol{
            width:42px;
            height:42px;
            position:relative;
            transform:rotate(45deg);
        }

        .logo-symbol::before,
        .logo-symbol::after{
            content:"";
            position:absolute;
            background:white;
            border-radius:3px;
        }

        .logo-symbol::before{
            width:13px;
            height:42px;
            left:14px;
        }

        .logo-symbol::after{
            width:42px;
            height:13px;
            top:14px;
        }

        .brand-cn{
            font-size:18px;
            font-weight:700;
            letter-spacing:1px;
        }

        .brand-en{
            margin-top:3px;
            font-size:9px;
            letter-spacing:2px;
            color:#8999ae;
        }

        .menu{
            display:flex;
            align-items:center;
            gap:40px;
            font-size:14px;
        }

        .menu a{
            color:#d7e1ee;
            transition:.3s;
            position:relative;
        }

        .menu a:hover{
            color:#59a8ff;
        }

        .menu a::after{
            content:"";
            position:absolute;
            left:0;
            bottom:-12px;
            width:0;
            height:2px;
            background:#2e8cff;
            transition:.3s;
        }

        .menu a:hover::after{
            width:100%;
        }

        .nav-register{
            padding:11px 22px;
            border-radius:5px;
            background:linear-gradient(90deg,#1776e8,#399aff);
            color:white !important;
        }

        .mobile-btn{
            display:none;
            font-size:26px;
            cursor:pointer;
        }


        /* ==========================
           Hero
        ========================== */

        .hero{
            min-height:800px;
            position:relative;
            overflow:hidden;

            display:flex;
            align-items:center;

            background:
                radial-gradient(circle at 78% 46%, rgba(18,97,246,.25), transparent 27%),
                linear-gradient(90deg,#020817 0%,#031024 48%,#041328 100%);
        }

        /* 科技网格 */

        .hero::before{
            content:"";
            position:absolute;
            inset:0;

            background-image:
            linear-gradient(rgba(34,130,255,.055) 1px,transparent 1px),
            linear-gradient(90deg,rgba(34,130,255,.055) 1px,transparent 1px);

            background-size:60px 60px;
            mask-image:linear-gradient(to bottom,transparent,black 30%,transparent);
        }

        .hero::after{
            content:"";
            width:700px;
            height:700px;

            position:absolute;
            right:-160px;
            bottom:-340px;

            border:1px solid rgba(50,143,255,.15);
            border-radius:50%;

            box-shadow:
                0 0 100px rgba(27,113,255,.18),
                inset 0 0 100px rgba(27,113,255,.07);
        }

        .hero-container{
            width:100%;
            max-width:1400px;
            margin:auto;
            padding:130px 30px 70px;

            display:grid;
            grid-template-columns:1fr 1.05fr;

            position:relative;
            z-index:3;
        }

        .hero-content{
            display:flex;
            flex-direction:column;
            justify-content:center;
            padding-right:30px;
        }

        .hero-label{
            display:inline-flex;
            align-items:center;
            gap:8px;

            width:max-content;

            padding:8px 15px;

            border:1px solid rgba(60,156,255,.3);
            border-radius:100px;

            background:rgba(35,122,255,.08);

            color:#65b2ff;
            font-size:13px;
            letter-spacing:1px;

            margin-bottom:25px;
        }

        .hero-label span{
            width:6px;
            height:6px;
            border-radius:50%;
            background:#28a5ff;
            box-shadow:0 0 12px #28a5ff;
        }

        .hero-title{
            font-size:64px;
            line-height:1.12;
            letter-spacing:2px;
            font-weight:800;
        }

        .hero-title strong{
            display:block;

            background:linear-gradient(90deg,#ffffff,#58adff,#246eff);

            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        .hero-desc{
            margin-top:25px;
            color:#b7c3d5;
            font-size:19px;
            line-height:1.9;
            max-width:630px;
        }

        .hero-tags{
            display:flex;
            flex-wrap:wrap;
            gap:20px;

            margin-top:25px;

            font-size:14px;
            color:#a8b8cb;
        }

        .hero-tags div{
            display:flex;
            align-items:center;
            gap:8px;
        }

        .hero-tags i{
            width:7px;
            height:7px;
            border-radius:50%;
            background:#2693ff;
            box-shadow:0 0 10px #2693ff;
        }

        .hero-buttons{
            display:flex;
            gap:15px;
            margin-top:35px;
        }

        .btn{
            padding:15px 28px;

            border-radius:5px;
            font-size:15px;

            display:inline-flex;
            align-items:center;
            justify-content:center;

            transition:.3s;
        }

        .btn-main{
            background:linear-gradient(90deg,#1474ef,#399cff);
            box-shadow:0 8px 28px rgba(31,132,255,.25);
        }

        .btn-main:hover{
            transform:translateY(-3px);
            box-shadow:0 15px 38px rgba(31,132,255,.35);
        }

        .btn-line{
            border:1px solid rgba(101,168,255,.45);
            background:rgba(14,53,104,.18);
        }

        .btn-line:hover{
            border-color:#399cff;
            background:rgba(38,133,255,.10);
        }

        /* Hero产品 */

        .hero-visual{
            min-height:600px;
            position:relative;

            display:flex;
            align-items:center;
            justify-content:center;
        }

        .robot-glow{
            position:absolute;

            width:520px;
            height:520px;

            border-radius:50%;

            background:
                radial-gradient(circle,
                rgba(24,120,255,.37),
                rgba(11,70,174,.11) 46%,
                transparent 70%);

            filter:blur(10px);
        }

        .robot-img{
            width:590px;
            max-height:620px;
            object-fit:cover;
            object-position:center;

            position:relative;
            z-index:2;

            border-radius:20px;

            box-shadow:
                0 40px 100px rgba(0,0,0,.55),
                0 0 80px rgba(20,100,255,.13);

            mask-image:
                linear-gradient(to bottom,
                black 80%,
                transparent 100%);
        }

        .product-badge{
            position:absolute;
            right:10px;
            top:90px;

            z-index:4;

            padding:14px 18px;

            background:rgba(5,18,42,.78);
            border:1px solid rgba(66,156,255,.28);
            backdrop-filter:blur(10px);

            border-radius:7px;
        }

        .product-badge small{
            color:#43a8ff;
            font-size:10px;
            letter-spacing:2px;
        }

        .product-badge strong{
            display:block;
            margin-top:5px;
            font-size:17px;
        }

        /* 数据条 */

        .numbers{
            max-width:1400px;
            margin:-78px auto 0;

            padding:0 30px;

            position:relative;
            z-index:5;
        }

        .numbers-inner{
            width:680px;

            display:grid;
            grid-template-columns:repeat(4,1fr);

            background:rgba(5,21,46,.91);
            border:1px solid rgba(44,130,255,.18);
            backdrop-filter:blur(15px);

            border-radius:8px;
            overflow:hidden;
        }

        .num{
            padding:25px 18px;
            text-align:center;
            position:relative;
        }

        .num:not(:last-child)::after{
            content:"";
            position:absolute;
            right:0;
            top:25%;
            width:1px;
            height:50%;
            background:rgba(255,255,255,.08);
        }

        .num strong{
            font-size:29px;
            color:#48a3ff;
        }

        .num p{
            color:#a9b6c8;
            margin-top:7px;
            font-size:12px;
        }


        /* ==========================
           通用section
        ========================== */

        .section{
            padding:120px 30px;
        }

        .container{
            max-width:1280px;
            margin:auto;
        }

        .section-head{
            margin-bottom:55px;
        }

        .section-en{
            font-size:12px;
            color:#348fff;
            letter-spacing:4px;
            margin-bottom:9px;
        }

        .section-title{
            font-size:38px;
            letter-spacing:1px;
        }

        .section-desc{
            color:#8294aa;
            font-size:15px;
            margin-top:13px;
        }


        /* ==========================
           关于我们
        ========================== */

        .about{
            background:
                radial-gradient(circle at 20% 50%,rgba(10,82,195,.09),transparent 30%);
        }

        .about-grid{
            display:grid;
            grid-template-columns:1.15fr .85fr;
            gap:70px;
        }

        .about-text h2{
            font-size:34px;
            line-height:1.4;
            margin-bottom:24px;
        }

        .about-text h2 span{
            color:#398fff;
        }

        .about-text p{
            color:#99a9bd;
            line-height:2;
            font-size:15px;
            margin-bottom:15px;
        }

        .about-line{
            display:flex;
            flex-wrap:wrap;
            gap:14px;
            margin-top:30px;
        }

        .about-line span{
            padding:10px 14px;

            border:1px solid rgba(55,140,255,.18);
            background:rgba(8,33,70,.45);
            border-radius:4px;

            color:#aebcd0;
            font-size:13px;
        }

        .advantage-mini{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:15px;
        }

        .mini-card{
            min-height:160px;
            padding:25px;

            border-radius:8px;

            background:
                linear-gradient(145deg,
                rgba(13,40,79,.86),
                rgba(4,16,36,.86));

            border:1px solid rgba(69,146,255,.14);

            transition:.35s;
        }

        .mini-card:hover{
            transform:translateY(-6px);
            border-color:rgba(70,158,255,.42);
        }

        .mini-number{
            color:#338fff;
            font-size:13px;
            margin-bottom:35px;
        }

        .mini-card h3{
            font-size:18px;
            margin-bottom:8px;
        }

        .mini-card p{
            font-size:13px;
            color:#8294aa;
            line-height:1.7;
        }


        /* ==========================
           最新科技
        ========================== */

        .technology{
            background:#030b19;
        }

        .tech-feature{
            min-height:520px;

            border-radius:14px;
            overflow:hidden;

            display:grid;
            grid-template-columns:1fr 1fr;

            border:1px solid rgba(65,146,255,.15);

            background:#061328;
        }

        .tech-img{
            position:relative;
            min-height:500px;
            overflow:hidden;
        }

        .tech-img img{
            width:100%;
            height:100%;
            object-fit:cover;
            transition:transform 1s;
        }

        .tech-feature:hover .tech-img img{
            transform:scale(1.04);
        }

        .tech-img::after{
            content:"";
            position:absolute;
            inset:0;

            background:
                linear-gradient(90deg,
                transparent 45%,
                #061328 100%);
        }

        .tech-content{
            display:flex;
            flex-direction:column;
            justify-content:center;

            padding:60px;
        }

        .new{
            width:max-content;

            color:#55aaff;
            border:1px solid rgba(63,153,255,.25);
            background:rgba(45,139,255,.07);

            padding:7px 12px;
            border-radius:3px;

            letter-spacing:2px;
            font-size:11px;

            margin-bottom:22px;
        }

        .tech-content h2{
            font-size:38px;
            margin-bottom:22px;
        }

        .tech-content h2 span{
            color:#459dff;
        }

        .tech-content p{
            color:#93a5bc;
            line-height:1.9;
            font-size:15px;
        }

        .tech-points{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:12px;

            margin-top:28px;
        }

        .tech-points div{
            padding:13px 15px;
            background:rgba(15,47,91,.45);
            border:1px solid rgba(64,145,255,.12);
            color:#b2c2d6;
            font-size:13px;
        }


        /* ==========================
           七大课程
        ========================== */

        .courses{
            background:
                radial-gradient(circle at 70% 10%,rgba(34,109,223,.08),transparent 30%);
        }

        .course-grid{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:18px;
        }

        .course-card{
            min-height:305px;
            padding:30px;

            position:relative;
            overflow:hidden;

            display:flex;
            flex-direction:column;

            border-radius:8px;

            background:
                linear-gradient(145deg,
                rgba(9,29,60,.92),
                rgba(4,15,34,.98));

            border:1px solid rgba(63,142,255,.14);

            transition:.4s;
        }

        .course-card::before{
            content:"";

            width:150px;
            height:150px;

            position:absolute;
            right:-80px;
            top:-80px;

            border-radius:50%;

            background:#1689ff;
            filter:blur(60px);
            opacity:.12;

            transition:.4s;
        }

        .course-card:hover{
            transform:translateY(-8px);
            border-color:rgba(60,153,255,.55);
            box-shadow:0 25px 60px rgba(0,0,0,.3);
        }

        .course-card:hover::before{
            opacity:.25;
        }

        .course-no{
            color:#278dff;
            font-size:12px;
            letter-spacing:3px;
        }

        .course-icon{
            width:50px;
            height:50px;

            margin:27px 0 23px;

            display:flex;
            align-items:center;
            justify-content:center;

            border-radius:8px;

            background:
                linear-gradient(145deg,
                rgba(27,116,235,.24),
                rgba(24,80,160,.10));

            border:1px solid rgba(70,156,255,.19);

            font-size:22px;
        }

        .course-card h3{
            font-size:20px;
            margin-bottom:13px;
        }

        .course-card p{
            flex:1;

            color:#8294aa;
            font-size:13px;
            line-height:1.85;
        }

        .course-link{
            margin-top:23px;
            color:#4fa3ff;
            font-size:13px;
        }

        .course-link:hover{
            color:white;
        }

        .course-card.feature{
            grid-column:span 2;

            background:
                linear-gradient(120deg,
                rgba(8,41,87,.96),
                rgba(3,15,34,.96));
        }


        /* ==========================
           基地优势
        ========================== */

        .base{
            background:#030b19;
        }

        .base-grid{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:20px;
        }

        .base-card{
            padding:35px 25px;
            min-height:230px;

            border-top:1px solid #278eff;
            background:linear-gradient(
                180deg,
                rgba(15,51,97,.55),
                rgba(4,15,33,.25)
            );

            transition:.35s;
        }

        .base-card:hover{
            background:linear-gradient(
                180deg,
                rgba(19,72,142,.65),
                rgba(4,15,33,.30)
            );
        }

        .base-icon{
            font-size:28px;
            margin-bottom:30px;
        }

        .base-card h3{
            margin-bottom:13px;
            font-size:18px;
        }

        .base-card p{
            color:#8798ac;
            font-size:13px;
            line-height:1.8;
        }


        /* ==========================
           CTA
        ========================== */

        .cta{
            padding:110px 30px;
            text-align:center;

            background:
                radial-gradient(circle at center,
                rgba(26,107,230,.19),
                transparent 42%),
                #020817;
        }

        .cta h2{
            font-size:42px;
        }

        .cta p{
            margin-top:18px;
            color:#8ea1b7;
        }

        .cta-buttons{
            display:flex;
            justify-content:center;
            gap:15px;
            margin-top:35px;
        }


        /* ==========================
           footer
        ========================== */

        footer{
            border-top:1px solid rgba(255,255,255,.06);

            background:#010610;

            padding:55px 30px 25px;
        }

        .footer-inner{
            max-width:1280px;
            margin:auto;

            display:flex;
            justify-content:space-between;
            gap:50px;
        }

        .footer-company h3{
            font-size:20px;
            margin-bottom:15px;
        }

        .footer-company p{
            max-width:650px;

            color:#718399;
            line-height:1.9;
            font-size:13px;
        }

        .footer-contact{
            color:#8596aa;
            font-size:13px;
            line-height:2;
        }

        .copyright{
            max-width:1280px;
            margin:45px auto 0;

            padding-top:20px;

            border-top:1px solid rgba(255,255,255,.05);

            color:#536174;
            font-size:12px;

            display:flex;
            justify-content:space-between;
        }


        /* ==========================
           手机端
        ========================== */

        @media(max-width:900px){

            .nav{
                height:65px;
                padding:0 18px;
            }

            .brand-cn{
                font-size:15px;
            }

            .brand-en{
                font-size:7px;
            }

            .logo-symbol{
                width:32px;
                height:32px;
                transform:scale(.8) rotate(45deg);
            }

            .mobile-btn{
                display:block;
            }

            .menu{
                display:none;

                position:absolute;
                top:65px;
                left:0;

                width:100%;

                padding:25px;

                flex-direction:column;
                gap:25px;

                align-items:flex-start;

                background:rgba(1,8,20,.97);
                border-bottom:1px solid rgba(255
